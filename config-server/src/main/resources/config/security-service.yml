spring:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:healthyme_auth}?createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:j0s33nr1qu3}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Boot 3 SQL init: creates the OAuth2 Authorization Server tables that
  # JdbcRegisteredClientRepository queries at startup, before app beans run.
  # Replaces the removed Boot 2 props (datasource.initialization-mode / datasource.data).
  sql:
    init:
      mode: always
      schema-locations: classpath:script.sql
      continue-on-error: false
  # Configuración OAuth2
  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:9000

server:
  port: 9000
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      userService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3

# nivel de logging para depuración
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    studio.devbyjose: DEBUG
    org.hibernate: INFO
    org.hibernate.SQL: DEBUG